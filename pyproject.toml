[project]
name = "vietnam-lottery-xsmb-analysis"
version = "0.1.0"
description = "Using GitHub Action to automatically fetch and analyze results of the Vietnam lottery daily."
authors = [
    {name = "Khiem Doan", email = "doankhiem.crazy@gmail.com"},
]

readme = "README.md"
license = {text = "MIT"}

requires-python = "==3.15.*"

dependencies = [
    "tzdata==2026.5",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "cloudscraper==1.2.71",
    "tenacity==9.2.1",
    "beautifulsoup4==4.15.0",
    "lxml==6.1.3",
    "numpy==2.5.4",
    "pandas==3.1.0",
    "pandera[pandas]==0.34.1",
    "pyarrow==26.0.0",
    "matplotlib==3.11.2",
    "seaborn==0.13.2",
    "jinja2==3.1.6",
]

[dependency-groups]
testing = [
    "pytest",
    "pytest-asyncio",
]
linting = [
    "isort",
    "ruff",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.isort]
line_length = 120

[tool.ruff]
line-length = 120
target-version = "py315"

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
